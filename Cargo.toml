[package]
name = "vt"
version = "0.1.0"
edition = "2024"
description = "Todos in your Markdown notes, from the terminal"
license = "MIT"
repository = "https://github.com/Delsinvg/vt"
homepage = "https://github.com/Delsinvg/vt"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
fuzzy-matcher = "0.3.7"
inquire = "0.9.5"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
walkdir = "2.5.1"

[dev-dependencies]
tempfile = "3.27.0"
